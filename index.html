<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axonscut</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon-96x96.png?v=20260414" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260414" />
    <link rel="shortcut icon" href="favicon.ico?v=20260414" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260414" />
    <meta name="apple-mobile-web-app-title" content="AxonsCut" />
    <link rel="manifest" href="site.webmanifest?v=20260414" />
</head>
<body>
    <div class="main-shell">
        <div class="logo-wrapper">
            <img src="assets/logo.png" alt="Axonscut Logo" class="top-right-logo">
        </div>
        <div class="shortcut-back hidden" id="back-button" title="回到首頁">«</div>
        <div class="container">
            
            <div id="drop-zone" class="drop-zone">
                <div class="icon">＋</div>
                <p>拖放 影片 或 音訊 檔案至此</p>
                <span class="hint">或點擊此處選擇</span>
                <input type="file" id="file-input" accept="video/*,audio/*" hidden>
            </div>

            <div id="editor" class="editor-container hidden">
            <div class="player-wrapper">
                <video id="main-video" class="hidden"></video>
                <audio id="main-audio" class="hidden"></audio>

                <div class="controls">
                    <button id="play-pause-btn" class="play-btn">▶</button>
                    <button id="speed-btn" class="speed-btn">1x</button>
                </div>
            </div>

            <div class="time-display">
                <span id="start-time">Start: 00:00.0</span>
                <span id="end-time">End: 00:00.0</span>
            </div>

            <div class="timeline-container">
                <canvas id="filmstrip-canvas"></canvas>
                <div id="playhead"></div>
                
                <div class="range-slider">
                    <div class="slider-track"></div>
                    <input type="range" id="slider-start" min="0" max="100" value="0" step="0.1">
                    <input type="range" id="slider-end" min="0" max="100" value="100" step="0.1">
                </div>
            </div>
            
            <button id="export-btn" class="export-btn">Export</button>
        </div>
    </div>
    
    <footer id="app-footer" style="position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; padding: 10px; color: #6b7280; font-size: 12px; font-family: sans-serif; z-index: 10;">
        <p style="margin: 5px 0;">
            🔒 <strong>100% 本地運算</strong>：您的檔案從未離開過設備，我們不收集或上傳任何資料。
        </p>
        <p style="margin: 5px 0;">
            © 2026 Axonscut. All rights reserved. | Powered by <a href="https://github.com/ffmpegwasm/ffmpeg.wasm" target="_blank" style="color: #3b82f6; text-decoration: none;">ffmpeg.wasm</a>
        </p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
