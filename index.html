<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axonscut</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-shell">
        <div class="logo-wrapper">
            <img src="assets/logo.png" alt="Axonscut Logo" class="top-right-logo">
        </div>
        <div class="shortcut-back hidden" id="back-button" title="回到首頁">«</div>
        <div class="container">
            
            <div id="drop-zone" class="drop-zone">
                <div class="icon">＋</div>
                <p>拖放 影片 或 音訊 檔案至此</p>
                <span class="hint">或點擊此處選擇</span>
                <input type="file" id="file-input" accept="video/*,audio/*" hidden>
            </div>

            <div id="editor" class="editor-container hidden">
            <div class="player-wrapper">
                <video id="main-video" class="hidden"></video>
                <audio id="main-audio" class="hidden"></audio>

                <div class="controls">
                    <button id="play-pause-btn" class="play-btn">▶</button>
                    <button id="speed-btn" class="speed-btn">1x</button>
                </div>
            </div>

            <div class="time-display">
                <span id="start-time">Start: 00:00.0</span>
                <span id="end-time">End: 00:00.0</span>
            </div>

            <div class="timeline-container">
                <canvas id="filmstrip-canvas"></canvas>
                <div id="playhead"></div>
                
                <div class="range-slider">
                    <div class="slider-track"></div>
                    <input type="range" id="slider-start" min="0" max="100" value="0" step="0.1">
                    <input type="range" id="slider-end" min="0" max="100" value="100" step="0.1">
                </div>
            </div>
            
            <button id="export-btn" class="export-btn">Export</button>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
